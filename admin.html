<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAVEN Admin – Live Draw</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0C2340;
  color:#fff;
}
header{
  background:#0C2340;
  padding:16px;
  text-align:center;
  border-bottom:3px solid #FA4C06;
}
header h1{
  margin:0;
  color:#FA4C06;
}
main{
  padding:20px;
}
.section{
  margin-bottom:20px;
}
label{
  display:block;
  margin-bottom:6px;
  color:#A7A8A9;
}
textarea{
  width:100%;
  min-height:120px;
  padding:10px;
  border-radius:6px;
  border:none;
}
button{
  padding:12px 18px;
  margin:6px 6px 6px 0;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}
.primary{
  background:#FA4C06;
  color:#fff;
}
.secondary{
  background:#A7A8A9;
  color:#0C2340;
}
.danger{
  background:#c0392b;
  color:#fff;
}
</style>
</head>

<body>

<header>

<header style="
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 24px;
  background:#0C2340;
  border-bottom:3px solid #FA4C06;
">

  <!-- LEFT LOGO -->
  <img src="logo-left.png"
       style="
         height:46px;
         filter:
           drop-shadow(0 0 2px #fff)
           drop-shadow(0 4px 8px rgba(0,0,0,.4));
       ">

  <!-- TITLE -->
  <h1 style="margin:0;color:#FA4C06;font-size:20px;">
    MAVEN Admin Panel
  </h1>

  <!-- RIGHT LOGO -->
  <img src="logo-right.png"
       style="
         height:46px;
         filter:
           drop-shadow(0 0 2px #fff)
           drop-shadow(0 4px 8px rgba(0,0,0,.4));
       ">


</header>

<main>

  <!-- TEAMS -->
  <div class="section">
    <label>Teams (one per line)</label>
    <textarea id="teamsInput" placeholder="Team A&#10;Team B&#10;Team C"></textarea>
  </div>

  <!-- PLAYERS -->
  <div class="section">
    <label>Players (one per line)</label>
    <textarea id="playersInput" placeholder="Player 1&#10;Player 2&#10;Player 3"></textarea>
  </div>

  <!-- ACTIONS -->
  <div class="section">
    <button class="primary" onclick="initDraw()">Initialize Draw</button>
    <button class="secondary" onclick="pickPlayer()">Pick Player</button>
       <button class="primary" onclick="startEvent()">▶ Start Event</button>
     <button class="danger" onclick="endEvent()">⏹ End Event</button>


  </div>
<!-- ADMIN STATUS -->
<div id="adminStatus"
     style="
       margin-top:16px;
       padding:14px;
       background:rgba(255,255,255,.12);
       border-radius:8px;
       display:none;
     ">
  <div id="statusTitle"
       style="font-size:18px;font-weight:bold;color:#FA4C06;">
  </div>

  <div id="statusDetails"
       style="margin-top:6px;font-size:14px;color:#A7A8A9;">
  </div>
</div>

  <!-- EXPORT / RESTART -->
  <div class="section">
    <button class="secondary" onclick="exportExcel()">Export Excel</button>
    <button class="secondary" onclick="exportPDF()">Export PDF</button>
    <button class="danger" onclick="protectedRestart()">Restart Draw</button>
  </div>

</main>

<!-- LIBRARIES -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>



<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyA2kDRHbPh_gh6Bmij39LUKF1lBNhbfDxg",
  authDomain: "maven-ramadan-draw.firebaseapp.com",
  projectId: "maven-ramadan-draw"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===============================
   INIT DRAW (Firebase)
================================ */
window.initDraw = async function(){
  const teams = document.getElementById("teamsInput").value
    .split("\n").map(t=>t.trim()).filter(Boolean);

  const players = document.getElementById("playersInput").value
    .split("\n").map(p=>p.trim()).filter(Boolean);

  if(!teams.length || !players.length){
    alert("Please enter teams and players");
    return;
  }

  const teamsObj = {};
  teams.forEach(t => teamsObj[t] = []);

  await setDoc(doc(db,"event","state"), {
    started: false,
    finished: false,
    remainingPlayers: players,
    lastPick: null,
    teams: teamsObj
  });

  alert("Draw Initialized");
};

/* ===============================
   PICK PLAYER (Firebase)
================================ */
window.pickPlayer = async function(){
  const ref = doc(db,"event","state");
  const snap = await getDoc(ref);

  if(!snap.exists()){
    alert("Draw not initialized");
    return;
  }

  const state = snap.data();

  if(state.finished){
    alert("Draw already finished");
    return;
  }

  const index = Math.floor(Math.random() * state.remainingPlayers.length);
  const player = state.remainingPlayers.splice(index,1)[0];

  const teamName = Object.keys(state.teams)
    .sort((a,b)=>state.teams[a].length - state.teams[b].length)[0];

  state.teams[teamName].push(player);
  state.lastPick = { player, team: teamName };

  if(state.remainingPlayers.length === 0){
    state.finished = true;
  }

  await setDoc(ref, state);
};

/* ===============================
   START / END EVENT
================================ */
window.startEvent = async function(){
  await setDoc(doc(db,"event","state"), { started:true }, { merge:true });
};

window.endEvent = async function(){
  await setDoc(doc(db,"event","state"), { ended:true }, { merge:true });
};
</script>

</body>
</html>
